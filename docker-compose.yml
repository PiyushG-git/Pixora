version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: socialify_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: socialify_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/socialify
      # The app expects FRONTEND_URL, JWT_SECRET, IMAGEKIT variables too
      # They can be loaded from .env file or overridden here.
    env_file:
      - Backend/.env
    depends_on:
      - mongodb

volumes:
  mongodb_data:
